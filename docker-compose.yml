services:
  backend:
    build: .
    container_name: pilates-backend
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://${DB_HOST:-host.docker.internal}:3306/pilates
      DB_USERNAME: pilates_app
      DB_PASSWORD: root
      JWT_SECRET: ""
      JWT_VALIDITY: "3600"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      LEMBRETE_CANAL: ${LEMBRETE_CANAL:-log}
      SMSGO_API_KEY: ${SMSGO_API_KEY:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  rabbitmq-data:
