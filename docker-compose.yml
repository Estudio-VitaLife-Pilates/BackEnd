services:
  backend:
    build: .
    container_name: pilates-backend
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://${DB_HOST:-host.docker.internal}:3306/pilates
      DB_USERNAME: pilates_app
      DB_PASSWORD: root
      JWT_SECRET: ""
      JWT_VALIDITY: "3600"
