services:
  mysql:
    image: mysql:8.4
    container_name: pilates-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pilates
    ports:
      - "3306:3306"

  backend:
    build: .
    container_name: pilates-backend
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pilates
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: 
      JWT_VALIDITY: 3600
    ports:
      - "8080:8080"