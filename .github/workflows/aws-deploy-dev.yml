name: Deploy to Amazon ECR and EC2

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend/dev
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  deploy:
    name: "[deploy] - dev (ECR/EC2)"
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SECRET_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend JAR
        run: bash ./mvnw --batch-mode clean package -DskipTests

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to the app instance through Systems Manager
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          SMSGO_API_KEY: ${{ secrets.SMSGO_API_KEY }}
          LEMBRETE_CANAL: ${{ vars.LEMBRETE_CANAL }}
          LEMBRETE_ANTECEDENCIA_HORAS: ${{ vars.LEMBRETE_ANTECEDENCIA_HORAS }}
          LEMBRETE_INTERVALO_MINUTOS: ${{ vars.LEMBRETE_INTERVALO_MINUTOS }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=InstanciaApp-01" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "The running app instance was not found." >&2
            exit 1
          fi

          DATABASE_HOST=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=InstanciaBD-01" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PrivateIpAddress" \
            --output text)

          if [ -z "$DATABASE_HOST" ] || [ "$DATABASE_HOST" = "None" ] || [[ "$DATABASE_HOST" == *[[:space:]]* ]]; then
            echo "Expected exactly one running database instance with a private IP." >&2
            exit 1
          fi

          if ! [[ "$DATABASE_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "The database instance returned an invalid private IPv4 address." >&2
            exit 1
          fi
          
          # Reminder/SMS settings come from the GitHub environment (secret SMSGO_API_KEY and
          # optional variables). They are written to extra.env on the instance only when the
          # secret exists, so a deploy without it never wipes what is already configured there.
          WRITE_EXTRA_ENV=""
          if [ -n "$SMSGO_API_KEY" ]; then
            for value in "$SMSGO_API_KEY" "$LEMBRETE_CANAL" "$LEMBRETE_ANTECEDENCIA_HORAS" "$LEMBRETE_INTERVALO_MINUTOS"; do
              if ! printf '%s\n' "$value" | grep -qE '^[A-Za-z0-9._:/@+-]*$'; then
                echo "Invalid character in the SMS/reminder secret or variables (letters, digits and . _ : / @ + - only)." >&2
                exit 1
              fi
            done
            EXTRA_ENV=$(printf 'SMSGO_API_KEY=%s\nLEMBRETE_CANAL=%s' "$SMSGO_API_KEY" "${LEMBRETE_CANAL:-sms}")
            if [ -n "$LEMBRETE_ANTECEDENCIA_HORAS" ]; then
              EXTRA_ENV=$(printf '%s\nLEMBRETE_ANTECEDENCIA_HORAS=%s' "$EXTRA_ENV" "$LEMBRETE_ANTECEDENCIA_HORAS")
            fi
            if [ -n "$LEMBRETE_INTERVALO_MINUTOS" ]; then
              EXTRA_ENV=$(printf '%s\nLEMBRETE_INTERVALO_MINUTOS=%s' "$EXTRA_ENV" "$LEMBRETE_INTERVALO_MINUTOS")
            fi
            EXTRA_ENV_B64=$(printf '%s\n' "$EXTRA_ENV" | base64 -w0)
            WRITE_EXTRA_ENV="install -d -m 750 /opt/infra-pilates/backend && (umask 077 && printf '%s' '$EXTRA_ENV_B64' | base64 --decode > /opt/infra-pilates/backend/extra.env)"
          fi

          SSM_COMMAND=$(cat <<EOF
          set -e
          if [ ! -x /usr/local/bin/deploy-backend ] || [ ! -s /opt/infra-pilates/backend/compose.yml ]; then
            command -v aws >/dev/null 2>&1 || { apt-get update && apt-get install -y awscli; }
            aws s3 cp --region "$AWS_REGION" \
              s3://infra-pilates-bronze/bootstrap/infra-pilates/app.sh \
              /tmp/infra-pilates-app-bootstrap.sh
            sed -i 's/\r$//' /tmp/infra-pilates-app-bootstrap.sh
            bash /tmp/infra-pilates-app-bootstrap.sh
          fi
          
          $WRITE_EXTRA_ENV
          /usr/local/bin/deploy-backend "$IMAGE_TAG" "$DATABASE_HOST"
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$SSM_COMMAND" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Bootstrap if needed and deploy backend image $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success)
                echo "Backend image $IMAGE_TAG deployed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the backend deployment." >&2
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
          exit 1
