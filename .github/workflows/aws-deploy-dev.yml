name: Deploy to Amazon ECR and EC2

on:
  push:
    branches: ["develop"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend/dev
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  deploy:
    name: "[deploy] - dev (ECR/EC2)"
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SECRET_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to the app instance through Systems Manager
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=InstanciaApp-01" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "The running app instance was not found." >&2
            exit 1
          fi

          SSM_COMMAND=$(cat <<EOF
          set -e
          if [ ! -x /usr/local/bin/deploy-backend ] || [ ! -s /opt/infra-pilates/backend/compose.yml ]; then
            command -v aws >/dev/null 2>&1 || { apt-get update && apt-get install -y awscli; }
            aws s3 cp --region "$AWS_REGION" \
              s3://infra-pilates-bronze/bootstrap/infra-pilates/app.sh \
              /tmp/infra-pilates-app-bootstrap.sh
            sed -i 's/\r$//' /tmp/infra-pilates-app-bootstrap.sh
            bash /tmp/infra-pilates-app-bootstrap.sh
          fi
          /usr/local/bin/deploy-backend "$IMAGE_TAG"
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$SSM_COMMAND" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Bootstrap if needed and deploy backend image $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success)
                echo "Backend image $IMAGE_TAG deployed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the backend deployment." >&2
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
          exit 1
